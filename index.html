<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Portfolio</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <!-- Hero Image section -->
  <div class="play-design-cont">
    <div class="hero-star"><img src="Assets/Star-svg.svg" alt=""></div>
    <p>Play & Design</p>
  </div>
  <div class="hero-grid"></div>

  <div class="landing-page-cont">
    <div class="star-svg1">
      <img src="Assets/Star-svg.svg" alt="Rotating star">
    </div>
    <div class="star-svg2">
      <img src="Assets/Star-svg.svg" alt="">
    </div>
    
    <!-- Nav bar -->
    <div id="nav-bar">
      <div class="name"><img src="" alt="">Vijaylaxmi Wandimali</div>
      <div class="nav-links">
        <!-- Works Button -->
          <div class="btn-wrapper">
              <button class="nav-btn works-btn">Works</button>
              <img src="Assets/Star-svg.svg" class="btn-hover-svg" alt="">
          </div>
          <!-- Playground Button -->
          <div class="btn-wrapper">
              <button class="nav-btn">Playground</button>
              <img src="Assets/Star-svg.svg" class="btn-hover-svg" alt="">
          </div>
          <!-- Design X Code Button -->
          <div class="btn-wrapper">
              <button class="nav-btn">Design X Code</button>
              <img src="Assets/Star-svg.svg" class="btn-hover-svg" alt="">
          </div>
          <!-- About Button -->
          <div class="btn-wrapper">
              <button class="nav-btn">About</button>
              <img src="Assets/Star-svg.svg" class="btn-hover-svg" alt="">
          </div>
      </div>
    </div>


    <div class="window-container">
      <img src="Assets/Vish_image_3.jpeg" alt="Arch Window Image">
      <img src="Assets/cloud.png" alt="floating cloud" class="cloud-png">
    </div>
    <div class="intro">
      <h3>Hi, I'm Vijaylaxmi!</h3>
      <p>I design experiences that are strategic, human-centred and full of personality</p>
    </div>


  </div>
  <script src="script.js"></script>

</html>
